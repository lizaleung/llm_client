[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-client"
version = "0.1.0"
description = "A unified, provider-agnostic LLM wrapper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
